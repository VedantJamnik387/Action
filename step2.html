<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEP 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: white;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-heading {
            text-align: center;
            font-weight: bold;
            font-style: italic;
            font-size: 40px;
            padding: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.13);
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .content {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .card-heading {
            text-align: center;
            font-size: 26px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #333;
        }

        .upi, .online {
            flex: 1 1 300px;
            max-width: 550px;
            min-height: 300px;
            background-color: rgba(5, 1, 1, 0.21);
            border: 2px solid black;
            border-radius: 6px;
            padding: 20px;
            border-radius: 8px;
        }
        .upi, .online:hover{
            box-shadow: 0 4px 6px rgba(0,0,0,0.13);
        }

        ul {
            padding-left: 20px;
        }

        h2{
            color: rgba(0, 128, 0, 0.826);
        }

        li {
            color: black;
            margin-bottom: 10px;
            font-size: 16px;
            line-height: 1.4;
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .main-heading {
                font-size: 22px;
            }

            .content {
                padding: 10px;
            }

            .upi, .online {
                flex: 1 1 100%;
                min-height: auto;
            }
        }
        .line{
            font-size: 50px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: bold;
            color: red;

        }
    </style>
</head>
<body>

    <h1 class="main-heading">Ask Questions For Different User</h1>

    <div class="content">
        <div class="upi">
            <h2 class="card-heading" >UPI Fraud Questions Ask</h2>
            <ul>
                <li class="line">U &nbsp; Do </li>
            </ul>
        </div>

        <div class="online">
            <h2 class="card-heading">Online Fraud Questions Ask</h2>
            <ul>
                <li class="line">U &nbsp;  DO </li>
            </ul>
        </div>
    </div>

</body>
</html>
