<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEP 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: white;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .main-heading {
            text-align: center;
            font-weight: bold;
            font-style: italic;
            font-size: 28px;
            padding: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.13);
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .content {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .card-heading {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #333;
        }

        .upi, .online {
            flex: 1 1 300px;
            max-width: 550px;
            min-height: 300px;
            background-color: antiquewhite;
            border: 2px solid black;
            padding: 20px;
            border-radius: 8px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 10px;
            font-size: 16px;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            .main-heading {
                font-size: 22px;
            }

            .content {
                padding: 10px;
            }

            .upi, .online {
                flex: 1 1 100%;
                min-height: auto;
            }
        }
    </style>
</head>
<body>

    <h1 class="main-heading">Creating Questions</h1>

    <div class="content">
        
    </div>

</body>
</html>
